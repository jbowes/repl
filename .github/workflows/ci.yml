name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check:images
      - run: npm test
      - run: npm run release
