# Gamegenic Sidekick Pro XL, a Magic: The Gathering Commander deck box.
#
# SOURCES AND HONESTY
# - MEASURED by the owner of the box (approximate, not a manufacturer spec),
#   and dimensioned on the drawing unless noted:
#     the box's base, 94.5 x 113 mm, with about 12.5 mm of base on each side of
#     the cubby opening (so the opening is in a 113 mm face; drawn as 12.25);
#     the tray cubby (the slot the tray slides into), 88.5 x 36 x 80 mm
#     (opening width x opening height x depth into the box);
#     the token tray's outer size, about 80 x 85.7 x 33.7 mm (W x D x H);
#     the "material width", 5.3 mm, used for the tray's walls;
#     the tray's thumb scoops, one on each of two opposite sides, starting
#     about 29.5 mm from each end of the wall with about 19 mm of wall left
#     under them (so 26.7 mm wide and 14.7 mm deep, assuming they are in the
#     85.7 mm walls). These are recorded with `hide: true` and not drawn.
#   The tray's inside width and depth are the outer size less two walls; its
#   inside height also takes off a floor ASSUMED to be 5.3 mm.
# - UNVERIFIED: the closed height, 102 mm, is from retailer listings, which
#   give 110 x 104 x 102 mm (one gives 85 x 100 x 102). The measured base does
#   not match either footprint, so the height may be off too. The manufacturer
#   does not publish dimensions.
# - ASSUMED from the 5.3 mm material: the body's walls, the slab under the
#   cubby and the compartment floor above it are all drawn 5.3 mm thick.
#   Nobody measured those.
# - GUESSED, estimated from a product photo, with no dimension lines: how high
#   the cubby sits (5.3 mm up from the base), the tray's floor thickness, the
#   size and round shape of the thumb scoops in the top of the compartment
#   (36 mm; the owner confirmed there is one on both sides) and the U shape of
#   the tray's scoops.
# - NOT DRAWN: the cover, a flap hinged at the bottom front, and the slide-in
#   card case on the front. The whole footprint is treated as one plain deck
#   box, drawn up to the full 102 mm as if the height did not include the cover.
# - DOES NOT ADD UP: with a 36 mm cubby under it, the compartment drawn here is about 55 mm
#   deep, which is less than a sleeved card is wide, so the 102 mm height
#   probably does not match the measured parts.
# - Features per the manufacturer: a removable cover that clips onto the
#   bottom, a front slide-in card case (UV protective, shows the commander
#   card), an integrated drawer for tokens and dice, magnets closing the lid,
#   capacity 100 double-sleeved cards.
#
# The plan shows the box and the tray pulled out of the cubby, toward the
# viewer; the front elevation looks straight into the cubby opening; the
# section cuts through the middle, across the cubby, and shows the tray in
# section beside it; the isometric view shows the inside through the open top,
# the cubby opening on the left face and the tray pulled out to the left.
#
# Axes: x is the 113 mm side (left to right), y is the 94.5 mm side (the front
# faces +y, and the cubby opens on the front face, which is the left face in
# the isometric view), z is height.
units: mm
scale: 2.2
views: [plan, front, section, iso]
columns: 1
cut: 47.25
shapes:
  # The deck box: one hollow open-top shell. Its floor is 46.6 mm thick, which
  # is the 5.3 mm slab under the cubby, the 36 mm cubby and the 5.3 mm
  # compartment floor above it. The cubby is a slot into that floor from the
  # front face, centred in the 113 mm side. Thumb scoops in the top of both
  # 113 mm walls (size estimated from a photo).
  - type: box
    id: body
    at: [0, 0, 0]
    size: [113, 94.5, 102]
    wall: 5.3
    floor: 46.6
    style: blue
    scoops:
      - { side: -y, at: 56.5, width: 36, shape: round }
      - { side: +y, at: 56.5, width: 36, shape: round }
    slots:
      - { side: +y, at: 56.5, width: 88.5, height: 36, depth: 80, bottom: 5.3 }
  # The token tray, a separate open-top tray shown pulled out of its cubby
  # toward the front, with a thumb scoop on both sides. Outer size, wall and
  # scoop size measured; floor and the scoops' U shape estimated.
  - type: box
    id: tray
    views: [plan, iso]
    at: [13.65, 154.5, 0]
    size: [85.7, 80, 33.7]
    wall: 5.3
    style: yellow
    scoops:
      # 29.5 mm in from each end of the 85.7 mm wall, 19 mm of wall left under it
      - { side: +y, at: 42.85, width: 26.7, depth: 14.7, shape: u }
      - { side: -y, at: 42.85, width: 26.7, depth: 14.7, shape: u }
  # The same tray for the section, beside the box where the cut crosses it.
  - type: box
    id: tray-section
    views: [section]
    at: [150, 7.25, 0]
    size: [85.7, 80, 33.7]
    wall: 5.3
    style: yellow
    scoops:
      - { side: +y, at: 42.85, width: 26.7, depth: 14.7, shape: u }
      - { side: -y, at: 42.85, width: 26.7, depth: 14.7, shape: u }

  # The box's base (measured) and its height (retailer listings). The isometric
  # view leaves the box's outer size off; the plan and front carry it.
  - { type: dim, views: [plan], from: [0, 0, 0], to: [113, 0, 0], offset: [0, -48, 0] }
  - { type: dim, views: [plan], from: [0, 0, 0], to: [0, 94.5, 0], offset: [-24, 0, 0] }
  - { type: dim, views: [front], from: [0, 94.5, 0], to: [113, 94.5, 0], offset: [0, 0, -24] }
  - { type: dim, views: [front], from: [0, 94.5, 0], to: [0, 94.5, 102], offset: [-24, 0, 0] }

  # The tray's three outer measurements (measured).
  - { type: dim, views: [plan, iso], from: [13.65, 234.5, 0], to: [99.35, 234.5, 0], offset: [0, 24, 0] }
  - { type: dim, views: [plan], from: [99.35, 154.5, 0], to: [99.35, 234.5, 0], offset: [24, 0, 0] }
  - { type: dim, views: [iso], from: [13.65, 234.5, 0], to: [13.65, 234.5, 33.7], offset: [-24, 0, 0] }
  - { type: dim, views: [section], from: [150, 47.25, 0], to: [150, 47.25, 33.7], offset: [-20, 0, 0] }

  # The tray's outer depth in iso, on the right-hand face (measured).
  - { type: dim, views: [iso], from: [99.35, 154.5, 0], to: [99.35, 234.5, 0], offset: [24, 0, 0] }

  # The tray's inside: the outer size less the 5.3 mm walls (75.1 x 69.4), and
  # its depth above a floor ASSUMED to be 5.3 mm too (28.4).
  - { type: dim, views: [plan], from: [18.95, 159.8, 0], to: [94.05, 159.8, 0], offset: [0, -14, 0] }
  - { type: dim, views: [plan], from: [94.05, 159.8, 0], to: [94.05, 229.2, 0], offset: [-12, 0, 0] }
  - { type: dim, views: [section], from: [160, 47.25, 5.3], to: [160, 47.25, 33.7] }
  # The same inside measurements in iso, along the floor and the far corner.
  - { type: dim, views: [iso], from: [18.95, 159.8, 5.3], to: [94.05, 159.8, 5.3], offset: [0, 0, 8] }
  - { type: dim, views: [iso], from: [18.95, 159.8, 5.3], to: [18.95, 229.2, 5.3], offset: [0, 0, 8] }
  - { type: dim, views: [iso], from: [18.95, 159.8, 5.3], to: [18.95, 159.8, 33.7], offset: [8, 0, 0] }
  # The tray's thumb scoops (measured): 29.5 mm in from each end of the wall,
  # so 26.7 mm wide, with 19 mm of wall left under them, so 14.7 mm deep.
  # Recorded but hidden, to keep the drawing clear; the scoops are still drawn.
  - { type: dim, views: [plan], from: [13.65, 234.5, 0], to: [43.15, 234.5, 0], offset: [0, 14, 0], hide: true }
  - { type: dim, views: [plan], from: [43.15, 234.5, 0], to: [69.85, 234.5, 0], offset: [0, 32, 0], hide: true }
  - { type: dim, views: [iso], from: [13.65, 234.5, 0], to: [13.65, 234.5, 19], offset: [-14, 0, 0], hide: true }
  - { type: dim, views: [iso], from: [13.65, 234.5, 19], to: [13.65, 234.5, 33.7], offset: [-30, 0, 0], hide: true }

  # The cubby's three measurements, and the base left on each side of its
  # opening (measured). 12.5 + 88.5 + 12.5 is 113.5, half a millimetre over the
  # 113 mm base, so that half millimetre is taken off the two sides: the
  # opening is centred with 12.25 mm each side.
  - { type: dim, views: [plan], from: [0, 0, 5.3], to: [12.25, 0, 5.3], offset: [0, -24, 0] }
  - { type: dim, views: [plan], from: [12.25, 0, 5.3], to: [100.75, 0, 5.3], offset: [0, -24, 0] }
  - { type: dim, views: [plan], from: [100.75, 0, 5.3], to: [113, 0, 5.3], offset: [0, -24, 0] }
  - { type: dim, views: [plan], from: [113, 14.5, 5.3], to: [113, 94.5, 5.3], offset: [24, 0, 0] }
  - { type: dim, views: [front], from: [12.25, 94.5, 5.3], to: [100.75, 94.5, 5.3], offset: [0, 0, -12] }
  - { type: dim, views: [front], from: [100.75, 94.5, 5.3], to: [100.75, 94.5, 41.3], offset: [20, 0, 0] }
  - { type: dim, views: [section], from: [12.25, 47.25, 5.3], to: [100.75, 47.25, 5.3], offset: [0, 0, -22] }
  - { type: dim, views: [section], from: [12.25, 47.25, 5.3], to: [12.25, 47.25, 41.3], offset: [-30, 0, 0] }

  # The cubby's width, height and depth in iso (measured): across and up the
  # opening on the left face, and along the right face for the depth.
  - { type: dim, views: [iso], from: [12.25, 94.5, 5.3], to: [100.75, 94.5, 5.3], offset: [0, 0, -12] }
  - { type: dim, views: [iso], from: [100.75, 94.5, 5.3], to: [100.75, 94.5, 41.3], offset: [6, 0, 0] }
  - { type: dim, views: [iso], from: [113, 14.5, 5.3], to: [113, 94.5, 5.3], offset: [24, 0, 0] }

  # Callouts name the parts. Recorded but hidden: the drawing carries only the
  # dimensions, and the callouts stay in the description.
  - { type: label, views: [plan], at: [30, 30, 102], to: [125, 28, 102], text: deck compartment (hollow), hide: true }
  - { type: label, views: [plan], at: [56.5, 2.6, 102], to: [-30, -78, 102], text: thumb scoops (approx.), hide: true }
  - { type: label, views: [plan], at: [56.5, 154.5, 33.7], to: [-40, 150, 33.7], text: thumb scoops, hide: true }
  - { type: label, views: [plan], at: [60, 60, 5.3], to: [125, 70, 5.3], text: tray cubby under (hidden), hide: true }
  - { type: label, views: [section], at: [56.5, 47.25, 20], to: [56.5, 47.25, -40], text: tray cubby, hide: true }
  - { type: label, views: [section], at: [2.6, 47.25, 80], to: [-40, 47.25, 105], text: wall (approx.), hide: true }
  - { type: label, views: [section], at: [56.5, 47.25, 75], to: [20, 47.25, 120], text: hollow deck compartment, hide: true }
  - { type: label, views: [front], at: [56.5, 94.5, 23], to: [125, 94.5, 60], text: tray cubby, hide: true }
  - { type: label, views: [iso], at: [56.5, 94.5, 23], to: [-60, 180, 60], text: tray cubby, hide: true }
  - { type: label, views: [iso], at: [56.5, 2.6, 90], to: [-60, -20, 140], text: thumb scoops (approx.), hide: true }
